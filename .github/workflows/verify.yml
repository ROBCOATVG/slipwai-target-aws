name: verify

on:
  push:
    branches: [main]
    # A tag is what publishes. A green run on `main` is a package that works; it is not a package
    # anybody asked for, and publishing every commit is how a chandlery fills with versions nobody
    # chose. `git tag v1.1.0 && git push --follow-tags` is the whole of releasing.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A called workflow cannot ask for more than its caller has, and the publish job attaches the release to
# this repository's own tag — so the permission is granted here or that job never starts.
permissions:
  contents: read

jobs:
  conformance:
    permissions:
      contents: write
    uses: ROBCOATVG/slipwai_v2_Fork/.github/workflows/package.yml@e4fc6f7c1c52bc7c720596e3de42dfbeccbcdef3
    with:
      package: aws
      kind: target
      # A target's matrix is a language's; this package names no toolchain and generates no variant.
      matrix: false
      toolchains: ''
      channel: 'ROBCOATVG/slipwai-index'
      keel: 'git+https://github.com/ROBCOATVG/slipwai_v2_Fork@e4fc6f7c1c52bc7c720596e3de42dfbeccbcdef3'
    secrets:
      chandlery_token: ${{ secrets.CHANDLERY_TOKEN }}

  # **The stacks, held to the real providers.** `package.yml` runs the conformance suite, which reads this
  # package's declaration and protocol; it does not run the package's own tests, and it cannot — the suite
  # that validates a stack has to generate a real project, and the keel installs no language. That is what
  # `tests/test_stack.py` says when it skips: "a package's own CI (3.7)". Until this repository existed
  # there was no such CI, so the one test that validates both deployment shapes against the real providers
  # ran nowhere. It runs here.
  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: packages/aws
      - uses: actions/checkout@v6
        with:
          repository: ROBCOATVG/slipwai_v2_Fork
          ref: 'e4fc6f7c1c52bc7c720596e3de42dfbeccbcdef3'
          path: keel
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: '1.12.6'
      # A real language, because a stack is validated by generating a project and a generated project
      # needs one. Taken from the chandlery, not from a checkout: what is proved is what somebody installs.
      # Every published language names BOTH clouds, so `language install` refuses while either target is
      # missing — "backend typescript answers target azure, which core does not declare". That is the
      # declaration working, not a bug: a language may not answer a target nothing declares. Until both
      # targets are in the chandlery the sibling comes from the pinned keel checkout, which is what
      # `package_sources` is for and what it says it is for — CI topology before publication, never an
      # installer fallback. **Delete this step once azure 1.0.0 is published**; the language install
      # below then resolves it from the channel like anybody else's.
      - name: Source the sibling target this language names
        env:
          PACKAGE_SOURCES_REPOSITORY: ROBCOATVG/slipwai_v2_Fork
          PACKAGE_SOURCES_REF: 'e4fc6f7c1c52bc7c720596e3de42dfbeccbcdef3'
          PACKAGE_SOURCES_NAMES: 'azure'
          PACKAGE_UNDER_TEST: aws
        run: |
          python -m pip install ./keel
          python -m slipwai.package_sources --source keel --destination packages
      - name: Install a published language beside this package
        env:
          SLIPWAI_LANGUAGES: ${{ github.workspace }}/packages
        run: python -m slipwai language install typescript
      - name: Validate every shape and variant against the pinned providers
        env:
          SLIPWAI_LANGUAGES: ${{ github.workspace }}/packages
        run: |
          cd keel
          PYTHONPATH="src:tests:$GITHUB_WORKSPACE/packages/aws" \
            python -m unittest discover -s "$GITHUB_WORKSPACE/packages/aws/tests" -p 'test_*.py' -v
